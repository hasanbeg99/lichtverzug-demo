<script>
'use strict';
// ================= Grundlagen =================
const cv=document.getElementById('c'), cx=cv.getContext('2d');
const SERIF="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif";
const W=390, CL=62, CR=328, FX=195, FH=26, FW=15, VMAX=92, FOGK=2.6, LR=165, RING_DT=0.7;
let DPR=1, SC=1, OX=0, H=844, SAT=0, SAB=0, BH=92, VW=390, VH=844;
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,k)=>a+(b-a)*k;
const mod=(a,b)=>((a%b)+b)%b;
const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
function rgba(n,f,k,a){return 'rgba('+(lerp(n[0],f[0],k)|0)+','+(lerp(n[1],f[1],k)|0)+','+(lerp(n[2],f[2],k)|0)+','+(a===undefined?1:a)+')';}
const PAL={stone:[226,200,156],stoneF:[98,148,192],dark:[58,46,38],darkF:[20,42,70],red:[255,84,60],green:[118,236,150],sigF:[140,170,214],
 hull:[66,58,54],hullF:[24,46,76],cargo:[188,158,114],cargoF:[72,118,162],warm:[255,214,140],warmF:[140,192,232],wood:[160,118,76],woodF:[64,104,142],white:[246,236,214],whiteF:[168,204,232]};
const ageK=a=>Math.pow(clamp(a/3.0,0,1),0.8);
const fmt1=x=>(Math.max(0,x)).toFixed(1).replace('.',',');
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function dateKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dateLabel(){const d=new Date();return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();}
const LS={get(k,d){try{const v=localStorage.getItem('lv_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('lv_'+k,JSON.stringify(v));}catch(e){}}};

// ================= Audio (WebAudio, synthetisch) =================
const AU={ctx:null,master:null,muted:LS.get('mute',false)};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  try{
  const a=AU.ctx=new AC(); AU.master=a.createGain(); AU.master.gain.value=AU.muted?0:0.85; AU.master.connect(a.destination);
  const len=a.sampleRate*2, nb=a.createBuffer(1,len,a.sampleRate), d=nb.getChannelData(0); let b=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;b=0.97*b+0.03*w;d[i]=b*3+w*0.12;}
  AU.noise=nb;
  const ws=a.createBufferSource();ws.buffer=nb;ws.loop=true;const wf=a.createBiquadFilter();wf.type='bandpass';wf.frequency.value=380;wf.Q.value=0.5;
  const wg=a.createGain();wg.gain.value=0.045;ws.connect(wf);wf.connect(wg);wg.connect(AU.master);ws.start();
  const lfo=a.createOscillator();lfo.frequency.value=0.13;const lg=a.createGain();lg.gain.value=0.02;lfo.connect(lg);lg.connect(wg.gain);lfo.start();
  const o1=a.createOscillator();o1.type='sawtooth';o1.frequency.value=44;const o2=a.createOscillator();o2.type='triangle';o2.frequency.value=88.6;
  const ef=a.createBiquadFilter();ef.type='lowpass';ef.frequency.value=170;const eg=a.createGain();eg.gain.value=0;
  o1.connect(ef);o2.connect(ef);ef.connect(eg);eg.connect(AU.master);o1.start();o2.start();
  AU.eng={o1,o2,ef,eg};
  }catch(e){AU.ctx=null;}
}
function auMute(m){AU.muted=m;LS.set('mute',m);if(AU.ctx)AU.master.gain.setTargetAtTime(m?0:0.85,AU.ctx.currentTime,0.03);}
function auEngine(v,on){if(!AU.ctx||!AU.eng)return;const k=v/VMAX,n=AU.ctx.currentTime,e=AU.eng;
  e.eg.gain.setTargetAtTime(on?0.02+0.085*k:0,n,0.08);e.o1.frequency.setTargetAtTime(44+17*k,n,0.12);e.o2.frequency.setTargetAtTime(88.6+34*k,n,0.12);e.ef.frequency.setTargetAtTime(150+260*k,n,0.12);}
function tone(f,dur,type,vol,delay,f2){if(!AU.ctx)return;const a=AU.ctx,t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+0.05);}
function noiseHit(dur,vol,type,f0,f1,delay){if(!AU.ctx)return;const a=AU.ctx,t=a.currentTime+(delay||0);const s=a.createBufferSource();s.buffer=AU.noise;
  const f=a.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random());s.stop(t+dur+0.05);}
const SND={
  bell(v){[1,2.76,5.4,8.93].forEach((m,i)=>tone(640*m,2.0/(i+1),'sine',v/(i*1.4+1)));tone(640,2.4,'sine',v*0.5,0.42);},
  open(v){tone(392,0.5,'sine',v);tone(523,0.7,'sine',v*0.8,0.09);},
  tick(){tone(1400,0.05,'sine',0.02);},
  crash(){noiseHit(0.9,0.6,'lowpass',2400,120);tone(90,0.5,'sine',0.5,0,38);noiseHit(0.25,0.25,'highpass',3000,800,0.02);},
  win(){[523,659,784,1046].forEach((f,i)=>tone(f,0.9,'triangle',0.12,i*0.12));SND.bell(0.08);},
  flare(){noiseHit(1.1,0.25,'bandpass',600,4000);tone(1800,1.2,'sine',0.04,0.2,2400);},
  pick(){tone(880,0.4,'sine',0.12);tone(1320,0.6,'sine',0.09,0.1);},
  ui(){tone(660,0.08,'triangle',0.05);}
};

// ================= Objekte =================
class Gate{ // Klappbrücke oder Schleusentor
  constructor(d,kind){this.kind=kind;this.s=d.s;this.P=d.P;this.openD=d.open;this.tr=d.tr||1.1;this.ph=d.ph||0;this.name=d.name||'';
    this.band=kind==='lock'?12:13;this.bc=kind==='lock'?6:0;this.lock=d.lock||null;this.emitOff=Math.random()*RING_DT;}
  u(t){return mod(t+this.ph,this.P);}
  open(t){const u=this.u(t),tr=this.tr;if(u<tr)return ease(u/tr);if(u<tr+this.openD)return 1;if(u<2*tr+this.openD)return 1-ease((u-tr-this.openD)/tr);return 0;}
  pos(){return{x:FX,s:this.s};}
  half(){return this.band+Math.abs(this.bc);}
  hit(fs,t){return Math.abs(fs-(this.s+this.bc))<FH+this.band&&this.open(t)<0.85;}
  events(t0,t1){const r=[],cU=this.tr+this.openD;for(const e of [[0,'open'],[cU,'close']]){const n=Math.floor((t1+this.ph-e[0])/this.P),te=n*this.P+e[0]-this.ph;if(te>t0&&te<=t1)r.push({te,type:e[1]});}return r;}
}
class Ship{ // Frachtkahn oder Treibgut
  constructor(d,kind){this.kind=kind;this.s=d.s;this.v=d.v;this.L=d.L||(kind==='debris'?44:122);this.Wd=kind==='debris'?11:30;this.gap=d.gap===undefined?1.6:d.gap;this.ph=d.ph||0;this.name=d.name||'';
    this.x0=CL-50-this.L/2;this.x1=CR+50+this.L/2;this.travel=this.x1-this.x0;this.P=this.travel/Math.abs(this.v)+this.gap;this.emitOff=Math.random()*RING_DT;this.rot=d.rot||0;}
  pos(t){const u=mod(t+this.ph,this.P),d=u*Math.abs(this.v);if(d>this.travel)return{x:this.v>0?this.x1:this.x0,s:this.s,off:true};return{x:this.v>0?this.x0+d:this.x1-d,s:this.s};}
  half(){return this.Wd/2;}
  hit(fs,t){const p=this.pos(t);if(p.off)return false;return Math.abs(p.x-FX)<this.L/2+FW-3&&Math.abs(fs-this.s)<FH+this.Wd/2-3;}
}

// ================= Level =================
const LEVELS=[
 {name:'Erste Überfahrt',station:'Roßauer Lände',c:210,len:1600,par:30,tut:true,hint:'Halten = fahren, Loslassen = stoppen. Fernes Licht ist alt.',
  objs:[{t:'bridge',s:560,name:'Augartenbrücke',P:9,open:3.6,ph:5.2}]},
 {name:'Weiter Blick',station:'Schottenring',c:165,len:2450,par:42,hint:'Je weiter weg, desto älter das Bild. Rote Ringe: Es schließt. Grüne: Es öffnet.',
  objs:[{t:'bridge',s:640,name:'Salztorbrücke',P:8,open:3,ph:1.5},{t:'lock',s:1180,len:175,name:'Schleuse Nußdorf',P:11,open:3.4,ph:2},{t:'bridge',s:1980,name:'Marienbrücke',P:7.2,open:2.5,ph:4}]},
 {name:'Schiffsverkehr',station:'Schwedenplatz',c:160,len:2650,par:48,hint:'Frachter queren den Kanal. Du siehst, wo sie waren – nicht, wo sie sind.',
  objs:[{t:'ship',s:520,v:78,ph:0.5},{t:'bridge',s:930,name:'Schwedenbrücke',P:8,open:3,ph:3},{t:'ship',s:1320,v:-96,ph:2.2},{t:'debris',s:1640,v:36,ph:0},{t:'debris',s:1640,v:36,ph:5.5},
   {t:'ship',s:1980,v:88,ph:3.6,L:140},{t:'ship',s:2260,v:-72,ph:0.8}]},
 {name:'Nebel über dem Kanal',station:'Urania',c:160,len:2900,par:55,fog:[[780,1650],[2050,2600]],hint:'Im Nebel kriecht das Licht noch langsamer. Was dahinter liegt, ist sehr alt.',
  objs:[{t:'ship',s:560,v:80,ph:1},{t:'ship',s:1060,v:-84,ph:3},{t:'bridge',s:1380,name:'Aspernbrücke',P:8.5,open:3,ph:2},{t:'debris',s:1590,v:-34,ph:1},
   {t:'bridge',s:1900,name:'Franzensbrücke',P:7.5,open:2.8,ph:5},{t:'ship',s:2330,v:92,ph:2.5},{t:'debris',s:2560,v:40,ph:4},{t:'debris',s:2560,v:40,ph:0}]},
 {name:'Die Laterne',station:'Weißgerberlände',c:150,len:3150,par:62,fog:[[620,1520],[1880,2780]],items:[380,1760],hint:'Sammle die Laterne. In ihrem warmen Schein siehst du die Gegenwart.',
  objs:[{t:'ship',s:820,v:-90,ph:2},{t:'bridge',s:1100,name:'Rotundenbrücke',P:8,open:2.7,ph:3},{t:'ship',s:1380,v:84,ph:0.5},
   {t:'lock',s:2020,len:170,name:'Schleuse Freudenau',P:10.5,open:3.2,ph:1},{t:'ship',s:2420,v:-100,ph:1.4},{t:'debris',s:2640,v:38,ph:2},{t:'bridge',s:2880,name:'Stadionbrücke',P:7,open:2.4,ph:0.7}]}
];
function buildObjs(defs){const out=[];for(const d of defs){
  if(d.t==='bridge')out.push(new Gate(d,'bridge'));
  else if(d.t==='lock'){const lk={s0:d.s,s1:d.s+d.len,name:d.name};out.push(new Gate({s:d.s,P:d.P,open:d.open,ph:d.ph,name:d.name+' · unten',lock:lk},'lock'));
    out.push(new Gate({s:d.s+d.len,P:d.P,open:d.open,ph:d.ph-d.P/2,name:'oben',lock:lk},'lock'));}
  else if(d.t==='ship')out.push(new Ship(d,'ship'));else if(d.t==='debris')out.push(new Ship(d,'debris'));}
  return out;}

// ================= Spielzustand =================
const G={state:'title',mode:'level',lvl:0,t:0,rt:0,F:{s:0,v:0},objs:[],rings:[],fog:[],items:[],locks:[],C:160,len:0,hold:false,
 flare:1,flareT:0,lanternT:0,crash:null,crashT:0,winT:0,sparks:[],tut:null,toast:null,E:null,FYf:0.72,ts:1,auto:false,used:false,passed:0,fogSeen:false,over:null};
const progress=LS.get('prog',{});
function setupWorld(objs,C,len,fog,items){G.objs=objs;G.C=C;G.len=len;G.fog=fog||[];G.items=(items||[]).map(s=>({s,taken:false}));G.rings=[];G.sparks=[];
  G.locks=[];for(const o of objs)if(o.lock&&G.locks.indexOf(o.lock)<0)G.locks.push(o.lock);G.t=0;G.F={s:0,v:0};G.flareT=0;G.lanternT=0;G.crash=null;G.flare=1;G.used=false;G.passed=0;G.fogSeen=false;G.hold=false;pointers.clear();}
function startTitle(){G.state='title';G.mode='title';G.FYf=0.56;setupWorld([new Gate({s:215,name:'Augartenbrücke',P:6.5,open:2.4,ph:0},'bridge'),new Ship({s:100,v:58,ph:1,gap:0.6},'ship')],140,99999,[],[]);}
function startLevel(i,intro){G.mode='level';G.lvl=i;const L=LEVELS[i];G.FYf=0.72;setupWorld(buildObjs(L.objs),L.c,L.len,L.fog,L.items);
  G.state=intro?'intro':'play';G.tut=L.tut?{st:0,tm:0}:null;G.toast=null;G.introT=0;}
function startEndless(){G.mode='endless';G.FYf=0.72;const key=dateKey();setupWorld([],170,1e9,[],[]);
  G.E={rng:mulberry(hashStr('lichtverzug-'+key)),next:420,lastFog:-9999,key,label:dateLabel(),time:28,bestDay:LS.get('best_'+key,0),bestAll:LS.get('best_all',0),passedSet:new Set()};
  genEndless();G.state='intro';G.tut=null;G.toast=null;}
function genEndless(){const E=G.E;
  while(E.next<G.F.s+1800){const r=E.rng,d=Math.min(1,E.next/7000),s=E.next;
    if(s-E.lastFog>1300&&s>900&&r()<0.22){const L=360+r()*420;G.fog.push([s-60,s-60+L]);E.lastFog=s+L;}
    const k=r();
    if(k<0.36){const P=6.8+r()*2.4;G.objs.push(new Gate({s,name:['Brücke','Klappbrücke','Steg'][Math.floor(r()*3)],P,open:3.4-1.0*d+r()*0.5,ph:r()*P},'bridge'));E.next+=300+r()*170;}
    else if(k<0.68){const v=(62+44*d+r()*24)*(r()<0.5?-1:1);G.objs.push(new Ship({s,v,ph:r()*8,L:110+r()*40,gap:1.2+r()*1.6},'ship'));E.next+=270+r()*170;}
    else if(k<0.8){const v=(30+16*d)*(r()<0.5?-1:1),ph=r()*6;G.objs.push(new Ship({s,v,ph},'debris'));G.objs.push(new Ship({s,v,ph:ph+4+r()*3},'debris'));E.next+=250+r()*120;}
    else if(k<0.9&&s>1200){const len=165,P=10+r()*1.5,ph=r()*P,lk={s0:s,s1:s+len,name:'Schleuse'};
      G.objs.push(new Gate({s,P,open:3.3,ph,name:'Schleuse · unten',lock:lk},'lock'));G.objs.push(new Gate({s:s+len,P,open:3.3,ph:ph-P/2,name:'oben',lock:lk},'lock'));G.locks.push(lk);E.next+=len+300;}
    else{G.items.push({s:s-60,taken:false});E.next+=200;}
  }
  const lim=G.F.s-700;G.objs=G.objs.filter(o=>o.s>lim);G.items=G.items.filter(i=>i.s>lim);G.fog=G.fog.filter(f=>f[1]>lim);G.locks=G.locks.filter(l=>l.s1>lim);
  const ids=new Set(G.objs);G.rings=G.rings.filter(r=>ids.has(r.o));
  G.C=170-38*Math.min(1,G.F.s/7000);
}

// ================= Lichtlaufzeit =================
function fogLenOnSeg(es,ps){if(!G.fog.length)return 0;const lo=Math.min(es,ps),hi=Math.max(es,ps);let ov=0;for(const f of G.fog)ov+=Math.max(0,Math.min(hi,f[1])-Math.max(lo,f[0]));return ov;}
function inFog(s){for(const f of G.fog)if(s>=f[0]&&s<=f[1])return true;return false;}
// effektive Lichtstrecke (Nebel verlängert sie)
function dEff(ex,es,fx,fs){const D=Math.hypot(fx-ex,fs-es);if(!G.fog.length)return D;const ds=Math.abs(fs-es);
  if(ds<1)return inFog(es)?D*FOGK:D;return D+(FOGK-1)*D*fogLenOnSeg(es,fs)/ds;}
// Retardierte Zeit: Zeitpunkt, dessen Licht JETZT beim Spieler ankommt
function retard(o,t){let p=o.pos(t),tau=t;for(let i=0;i<8;i++){tau=t-dEff(p.x,p.s,FX,G.F.s)/G.C;p=o.pos(tau);if(o.kind!=='ship'&&o.kind!=='debris')break;}return tau;}
function shown(o){const t=G.t;let tau=retard(o,t),mode='old';
  if(G.flareT>0){tau=t;mode='flare';}
  else if(G.lanternT>0){const p=o.pos(t);if(Math.hypot(p.x-FX,p.s-G.F.s)<LR+(o.L?o.L*0.3:0)){tau=t;mode='lantern';}}
  return{tau,age:t-tau,mode};}
function ringRadius(r){const e=G.C*(G.t-r.te);if(!G.fog.length)return e;const D=Math.hypot(FX-r.x,G.F.s-r.s);if(D<1)return e;
  let lo=0,hi=e;for(let i=0;i<12;i++){const m=(lo+hi)/2,k=m/D,px=r.x+(FX-r.x)*k,ps=r.s+(G.F.s-r.s)*k;if(dEff(r.x,r.s,px,ps)<e)lo=m;else hi=m;}return lo;}

// ================= Update =================
const pointers=new Map();
function worldUpdate(dt,live){
  const t0=G.t;G.t+=dt;const t=G.t,F=G.F;
  if(live){if(G.auto)G.hold=botDecide();const tv=G.hold?VMAX:0;F.v+=(tv-F.v)*Math.min(1,dt*9);if(!G.hold&&F.v<1.2)F.v=0;F.s+=F.v*dt;}
  else F.v*=Math.max(0,1-dt*6);
  if(G.flareT>0)G.flareT-=dt;if(G.lanternT>0)G.lanternT-=dt;
  // Ringe aussenden
  for(const o of G.objs){if(Math.abs(o.s-F.s)>1350)continue;
    if(Math.floor((t+o.emitOff)/RING_DT)!==Math.floor((t0+o.emitOff)/RING_DT)){const p=o.pos(t);if(!p.off)G.rings.push({o,x:p.x,s:p.s,te:t,type:'n',arr:-1});}
    if(o.events)for(const e of o.events(t0,t))G.rings.push({o,x:FX,s:o.s,te:e.te,type:e.type,arr:-1});}
  // Ankunft
  for(let i=G.rings.length-1;i>=0;i--){const r=G.rings[i],e=G.C*(t-r.te),d=dEff(r.x,r.s,FX,F.s);
    if(r.arr<0&&e>=d){r.arr=t;if(live&&r.type!=='n'){const v=clamp(0.18-Math.abs(r.s-F.s)/9000,0.05,0.18);
        if(r.type==='close'){SND.bell(v);G.sparks.push({t:0,c:PAL.red});if(G.tut)G.tut.sawRed=true;}else{SND.open(v*0.5);G.sparks.push({t:0,c:PAL.green});}}}
    if((r.arr>=0&&t-r.arr>0.5)||e>1700)G.rings.splice(i,1);}
  for(let i=G.sparks.length-1;i>=0;i--){G.sparks[i].t+=dt;if(G.sparks[i].t>0.6)G.sparks.splice(i,1);}
  if(!live)return;
  // Laterne einsammeln
  for(const it of G.items)if(!it.taken&&Math.abs(it.s-F.s)<FH+10){it.taken=true;G.lanternT=12;SND.pick();toast('Laterne: Im warmen Kreis siehst du die Gegenwart.',2.8);}
  if(!G.fogSeen&&inFog(F.s+FH+260)&&G.mode!=='title'){G.fogSeen=true;toast('Nebel: Das Licht ist hier '+String(FOGK).replace('.',',')+'× langsamer.',2.8);}
  // Kollision mit WAHREN Positionen
  for(const o of G.objs){if(Math.abs(o.s-F.s)>200)continue;if(o.hit(F.s,t)){doCrash(o);return;}}

    cx.fillText('Hell umrandet: wo alles JETZT ist.',W/2,y+80);
    cx.font='600 13px '+SERIF;cx.fillStyle='rgba(255,226,160,0.95)';spaced('TIPPEN = SOFORT NOCHMAL',W/2,y+112,2);btn('menu',W/2-50,y+124,100,26,'Menü','s');}
  cx.globalAlpha=1;}
function drawWin(){const r=G.result,L=LEVELS[G.lvl],wt=G.winT;if(wt<0.4)return;cx.globalAlpha=Math.min(1,(wt-0.4)*4);const y=H*0.5-130;card(24,y,W-48,282);cx.textAlign='center';
  cx.font='italic 12px '+SERIF;cx.fillStyle='rgba(232,214,174,0.75)';cx.fillText('Station '+(G.lvl+1)+' von 5',W/2,y+28);
  cx.font='600 24px '+SERIF;cx.fillStyle='#f3e6c8';cx.fillText('Angelegt · '+L.station,W/2,y+60);
  for(let i=0;i<3;i++){const on=i<r.st,x=W/2-44+i*44;star(x,y+98,15,on);}
  cx.font='13px '+SERIF;cx.fillStyle='#e8dcc0';cx.fillText('Zeit '+fmtT(r.tm)+' · Richtzeit '+fmtT(L.par)+(r.newBest?' · Bestzeit!':''),W/2,y+136);
  cx.font='italic 12px '+SERIF;cx.fillStyle='rgba(232,214,174,0.7)';cx.fillText('★ angelegt  ★ in Richtzeit  ★ ohne Leuchtrakete',W/2,y+156);
  if(G.lvl<4)btn('next',W/2-110,y+176,220,46,'Weiter: '+LEVELS[G.lvl+1].station);else btn('endless',W/2-110,y+176,220,46,'Nachtfahrt starten');
  btn('retry',36,y+232,(W-72)/2-6,30,'Nochmal','s');btn('menu',W/2+6,y+232,(W-72)/2-6,30,'Stationen','s');cx.globalAlpha=1;}
function star(x,y,r,on){cx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*0.45:r;cx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}cx.closePath();
  if(on){drawGlow([255,210,130],x,y,r*2,0.6);cx.fillStyle='#ffd98e';cx.fill();}else{cx.strokeStyle='rgba(232,214,174,0.4)';cx.lineWidth=1.2;cx.stroke();}}
function drawTitle(){BTN=[];drawBand();cx.textAlign='center';
  cx.font='600 40px '+SERIF;cx.fillStyle='#f3e6c8';spaced('LICHTVERZUG',W/2,BH+58,5);
  cx.font='italic 15px '+SERIF;cx.fillStyle='rgba(232,214,174,0.85)';cx.textAlign='center';cx.fillText('Eine Nachtfähre auf dem Donaukanal.',W/2,BH+84);cx.fillText('In dieser Welt ist das Licht langsam.',W/2,BH+104);
  const by=H-SAB-292;card(30,by,W-60,72);cx.textAlign='center';cx.font='600 16px '+SERIF;cx.fillStyle='#f3e6c8';cx.fillText('Halten = fahren · Loslassen = stoppen',W/2,by+29);
  cx.font='italic 15px '+SERIF;cx.fillStyle='#ffd796';cx.fillText('Fernes Licht ist alt.',W/2,by+53);
  const next=Math.min(4,LEVELS.findIndex((l,i)=>!progress[i])<0?4:LEVELS.findIndex((l,i)=>!progress[i]));
  btn('play',40,H-SAB-202,W-80,52,next===0?'Fahrt beginnen':'Weiter: '+LEVELS[next].station);
  btn('endless',40,H-SAB-140,W-80,44,'Nachtfahrt · Tagesroute '+dateLabel(),'s');
  const bd=LS.get('best_'+dateKey(),0);cx.font='italic 11px '+SERIF;cx.fillStyle='rgba(232,214,174,0.6)';cx.textAlign='center';cx.fillText(bd?'Dein Bestwert heute: '+bd+' m':'Heute für alle dieselbe Route',W/2,H-SAB-82);
  for(let i=0;i<5;i++){const x=W/2-104+i*52,y=H-SAB-48,p=progress[i];BTN.push({id:'lvl'+i,x:x-22,y:y-22,w:44,h:44});
    cx.beginPath();cx.arc(x,y,17,0,7);cx.fillStyle=p?'rgba(232,214,174,0.9)':'rgba(10,18,32,0.8)';cx.fill();cx.strokeStyle='rgba(232,214,174,0.6)';cx.lineWidth=1;cx.stroke();
    cx.font='600 14px '+SERIF;cx.fillStyle=p?'#1b140e':'#e8d6ae';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(String(i+1),x,y+1);cx.textBaseline='alphabetic';
    if(p){cx.font='9px '+SERIF;cx.fillStyle='#ffd98e';cx.fillText('★'.repeat(p.st),x,y+30);}}}
function render(){cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#060b15';cx.fillRect(0,0,cv.width,cv.height);
  cx.setTransform(DPR*SC,0,0,DPR*SC,OX*DPR,0);cx.save();cx.beginPath();cx.rect(0,0,W,H);cx.clip();
  drawWorld();
    drawGrain();
  if(G.state==='title')drawTitle();
  else{drawHUD();if(G.state==='intro')drawIntro();else if(G.state==='crash')drawCrash();else if(G.state==='win')drawWin();}
  cx.restore();}

// ================= Eingabe =================
function toLogical(e){return{x:(e.clientX-OX)/SC,y:e.clientY/SC};}
function hitBtn(p){for(let i=BTN.length-1;i>=0;i--){const b=BTN[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b.id;}return null;}
function action(id){SND.ui();switch(id){
  case'mute':auMute(!AU.muted);break;case'menu':startTitle();break;case'flare':useFlare();break;
  case'play':{let n=LEVELS.findIndex((l,i)=>!progress[i]);if(n<0)n=0;startLevel(n,true);break;}
  case'endless':startEndless();break;case'next':startLevel(G.lvl+1,true);break;case'retry':startLevel(G.lvl,false);break;
  default:if(id&&id.startsWith('lvl'))startLevel(+id.slice(3),true);}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();auInit();const p=toLogical(e),b=hitBtn(p);pointers.set(e.pointerId,{btn:b});
  if(!b&&G.state==='play')G.hold=true;if(b==='flare')useFlare();},{passive:false});
function up(e){const pt=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(!pt)return;const p=toLogical(e),b=hitBtn(p);
  if(pt.btn){if(b===pt.btn&&b!=='flare')action(b);return;}
  if(G.state==='play'){G.hold=[...pointers.values()].some(q=>!q.btn);}
  else if(G.state==='intro'&&G.introT>0.25){G.state='play';G.hold=false;}
  else if(G.state==='crash'&&G.crashT>0.45){if(G.mode==='endless')startEndless();else startLevel(G.lvl,false);G.state='play';}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();auInit();if(G.state==='play')G.hold=true;}
  if(e.code==='KeyF')useFlare();});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'){if(G.state==='play')G.hold=false;else if(G.state==='intro')G.state='play';else if(G.state==='crash'&&G.crashT>0.45){if(G.mode==='endless')startEndless();else startLevel(G.lvl,false);G.state='play';}}});
addEventListener('blur',()=>{pointers.clear();G.hold=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pointers.clear();G.hold=false;}});

// Testschnittstelle
window.__lv={G,LEVELS,shown,retard,dEff,ringRadius,startLevel,startEndless,startTitle,useFlare,BTN:()=>BTN,setTS:v=>{G.ts=v;},auto:v=>{G.auto=v;},hold:v=>{G.hold=v;}};
resize();startTitle();requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
</script>
</body>
